name: Vigilnz Scan Test
on: 
  workflow_dispatch: # lets you run manually from the Actions tab

jobs:
  Vigilnz_Scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Vigilnz Scan
        id: vigilnz
        uses: vigilnz/vigilnz-scan-action@master
        with:
          vigilnzApiKey: "${{ secrets.VIGILNZ_API_KEY }}"
          scanTypes: "sca,sbom,sast,iac,secret"
          # environment: "dev"
          projectName: "Next"
          waitForCompletion: true
          # failOnSeverity: "critical"
      - name: Write results to file
        run: echo '${{ steps.vigilnz.outputs.resultsJson }}' > vigilnz-results.json
      
      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: vigilnz-scan-results
          path: vigilnz-results.json
